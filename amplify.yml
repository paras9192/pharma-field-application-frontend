version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        # Fails the deploy on a hooks-order violation, which typechecking and
        # the build cannot catch — see src/test/hooks-order.test.ts.
        - npm test
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
